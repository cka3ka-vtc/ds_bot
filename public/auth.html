<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Вход — Ckaзka Dev</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f5bd5'/%3E%3Cpath d='M8 8h6v6H8zM18 8h6v6h-6zM8 18h6v6H8zM18 18h6v6h-6z' fill='white'/%3E%3C/svg%3E" />
<script>(function(){try{var t=localStorage.getItem('theme');var d=matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',t||(d?'dark':'light'));}catch(e){}})();</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="assets/css/tokens.css" />
<link rel="stylesheet" href="assets/css/base.css" />
<link rel="stylesheet" href="assets/css/components.css" />
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;background:
  radial-gradient(circle at 20% 30%, var(--accent-soft), transparent 60%),
  radial-gradient(circle at 80% 70%, var(--purple-soft), transparent 60%), var(--bg);}
.auth-back{position:fixed;top:20px;left:20px;display:inline-flex;align-items:center;gap:8px;
  padding:10px 16px;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-lg);color:var(--text-soft);font-size:13px;font-weight:600;
  text-decoration:none;transition:all .2s;z-index:10;}
.auth-back:hover{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);text-decoration:none;}
.auth-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2xl);padding:36px 32px;box-shadow:var(--shadow-xl);text-align:center;}
.auth-logo{width:72px;height:72px;border-radius:18px;background:var(--accent-gradient);display:grid;place-items:center;margin:0 auto 20px;color:#fff;box-shadow:0 12px 32px rgba(79,91,213,.35);animation:brandMarkPulse 4s ease-in-out infinite;}
.auth-logo svg{width:34px;height:34px;}
.auth-card h1{font-size:26px;font-weight:800;letter-spacing:-.8px;margin-bottom:8px;color:var(--text);
  background:var(--accent-gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.auth-card p{font-size:14px;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.auth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;background:#5865F2;color:#fff;border:none;border-radius:var(--r-lg);font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;box-shadow:0 6px 20px rgba(88,101,242,.35);}
.auth-btn:hover{background:#4752c4;transform:translateY(-1px);text-decoration:none;color:#fff;}
.auth-error{background:var(--red-soft);color:var(--red);padding:10px 14px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;display:none;}
</style>
</head>
<body>
<a href="/index.html" class="auth-back">
  <i class="fa-solid fa-arrow-left"></i>
  На главную
</a>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <svg viewBox="0 0 32 32" fill="currentColor"><path d="M8 8h6v6H8zM18 8h6v6h-6zM8 18h6v6H8zM18 18h6v6h-6z"/></svg>
    </div>
    <h1>Ckaзka Dev</h1>
    <p>Войдите через Discord, чтобы управлять ботом на своих серверах</p>
    <div class="auth-error" id="authError">Ошибка авторизации. Попробуйте снова.</div>
    <a href="/auth/discord" class="auth-btn">
      <i class="fa-brands fa-discord"></i>
      Войти через Discord
    </a>
  </div>
</div>
<script>
(function(){
  const p = new URLSearchParams(location.search);
  const err = p.get('error');
  if (err) {
    const el = document.getElementById('authError');
    el.style.display = 'block';
    el.textContent = {
      invalid_state:   'Невалидный state — попробуйте снова',
      token_exchange:  'Не удалось получить токен Discord',
    }[err] || 'Ошибка авторизации';
  }
  fetch('/auth/me').then((r) => { if (r.ok) location.href = '/panel.html'; }).catch(() => {});
})();
</script>
</body>
</html>
